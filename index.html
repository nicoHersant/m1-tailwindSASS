 <!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/style.css" rel="stylesheet" />
  <title>Dashboard</title>
</head>

<body class="min-h-screen bg-gray-950 text-white">

  <!-- Layout global -->
  <div id="layout" class="grid min-h-screen grid-cols-[256px_1fr] transition-all duration-300">

    <!-- Aside -->
    <aside id="aside" class="bg-slate-800 flex flex-col">
      <div class="h-16 flex items-center justify-center font-bold border-b border-slate-700">
        Menu
      </div>

      <nav class="flex-1 p-4 space-y-2 text-sm">
        <a class="flex items-center gap-3 px-3 py-2 rounded hover:bg-slate-700">
          <span class="menu-label">Accueil</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 rounded hover:bg-slate-700">
          <span class="menu-label">Utilisateurs</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 rounded hover:bg-slate-700">
          <span class="menu-label">Statistiques</span>
        </a>
      </nav>

      <footer class="p-3 text-xs text-center text-slate-400 border-t border-slate-700">
        © 2026
      </footer>
    </aside>

    <!-- Zone principale -->
    <div class="flex flex-col min-h-screen">

      <!-- Header -->
      <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center px-6 justify-between">
        <button id="toggle" class="text-white">☰</button>
        <h1 class="text-lg font-semibold">Tableau de bord</h1>
      </header>

      <!-- Main scrollable -->
      <main class="flex-1 overflow-y-auto p-6">

        <!-- Grille de cartes -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="bg-slate-600 rounded shadow p-4">Carte 1</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 2</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 3</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 4</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 5</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 6</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 7</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 8</div>
          <div class="bg-slate-600 rounded shadow p-4">Carte 9</div>
        </section>

      </main>
    </div>
  </div>

  <!-- JS minimal -->
  <script>
    const toggle = document.getElementById('toggle')
    const layout = document.getElementById('layout')
    const aside = document.getElementById('aside')
    const labels = document.querySelectorAll('.menu-label')

    let collapsed = false

    toggle.addEventListener('click', () => {
      collapsed = !collapsed

      layout.classList.toggle('grid-cols-[256px_1fr]')
      layout.classList.toggle('grid-cols-[80px_1fr]')

      labels.forEach(label => label.classList.toggle('hidden'))
    })
  </script>
</body>
</html>
