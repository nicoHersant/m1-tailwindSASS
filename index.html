<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="/src/main.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cours</title>

<body class="min-h-screen flex flex-col bg-gray-950">
    <header class="bg-slate-800 text-white p-4">
        <h1 class="text-xl font-semibold">Application Tailwind</h1>
    </header>

    <main class="flex-1 p-4">
        Contenu principal
        <div class="max-w-sm mx-auto bg-white/80 rounded-xl shadow-md overflow-hidden md:max-w-2xl my-8">
            <div class="md:flex">
                <div class="md:shrink-0">

                </div>
                <div class="p-8">
                    <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold">Catégorie Produit</div>
                    <a href="#" class="block mt-1 text-lg leading-tight font-medium text-black hover:underline">Nom du produit exceptionnel</a>

                    </p>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="text-xl font-bold text-gray-900">$199.99</span>
                        <button class="bg-blue-500/50 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full">
                            Ajouter au panier
                        </button>
                    </div>
                </div>
            </div>
        </div>

    <footer class="bg-slate-800 p-4 text-center text-white text-sm">© 2026</footer>
