 <!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
</head>

<body class="min-h-screen bg-(--bg) text-(--text)">

  <!-- Layout global -->
  <div id="layout" class="grid min-h-screen grid-cols-[256px_1fr] transition-all duration-300">

    <!-- Aside -->
    <aside id="aside" class="flex flex-col">
      <div class="h-16 flex items-center justify-center font-bold border-b">
        Menu
      </div>

      <nav class="flex-1 p-4 space-y-2 text-sm">
        <a class="flex items-center gap-3 px-3 py-2 rounded">
          <span class="menu-label">Accueil</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 rounded">
          <span class="menu-label">Utilisateurs</span>
        </a>
        <a class="flex items-center gap-3 px-3 py-2 rounded">
          <span class="menu-label">Statistiques</span>
        </a>
      </nav>

      <footer class="p-3 text-xs text-center text-slate-400 border-t">
        © 2026
      </footer>
    </aside>

    <!-- Zone principale -->
    <div class="flex flex-col min-h-screen">

      <!-- Header -->
      <header class="h-16 border-b flex items-center px-6 justify-between">
        <button id="toggle" class="">☰</button>
        <h1 class="text-lg font-semibold">Tableau de bord</h1>
        <button id="themeToggle" class="btn btn-primary">Changer thème</button>
      </header>

      <!-- Main scrollable -->
      <main class="flex-1 overflow-y-auto p-6">

        <!-- Grille de cartes -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="card">Carte 1</div>
          <div class="card">Carte 2</div>
          <div class="card">Carte 3</div>
          <div class="card">Carte 4</div>
          <div class="card">Carte 5</div>
          <div class="card">Carte 6</div>
          <div class="card">Carte 7</div>
          <div class="card">Carte 8</div>
          <div class="card">Carte 9</div>
        </section>

      </main>
    </div>
  </div>


  <script type="module" src="/src/main.ts"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle')

    themeToggle?.addEventListener('click', () => {
        const root = document.documentElement
        const current = root.getAttribute('data-theme')

        root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark')
        console.log(root.getAttribute('data-theme'))
    })
    </script>
</body>
</html>
