<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="/src/main.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cours</title>
</head>
<body class="min-h-screen flex flex-col bg-gray-950">
    <header class="bg-slate-800 text-white p-4">
        <h1 class="text-xl font-semibold">Application Tailwind</h1>
    </header>

    <main class="flex-1 p-4">
        <div class="flex flex-col md:flex-row gap-4">
            <section class="bg-white p-4 shadow md:w-2/3">
                Contenu principal
                <div class="max-w-sm mx-auto bg-white/80 rounded-xl shadow-md overflow-hidden md:max-w-2xl my-8">
                    <div class="md:flex">
                        <div class="md:shrink-0">
                            <img class="h-48 w-full object-cover md:h-full md:w-48" src="https://placehold.co/400x500?text=Hello\nWorld" alt="Image du produit">
                        </div>
                        <div class="p-8">
                            <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold">Catégorie Produit</div>
                            <a href="#" class="block mt-1 text-lg leading-tight font-medium text-black hover:underline">Nom du produit exceptionnel</a>
                            <p class="mt-2 text-gray-500">
                                Découvrez notre nouveau produit avec des fonctionnalités innovantes et un design élégant. Disponible en plusieurs couleurs.
                            </p>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xl font-bold text-gray-900">$199.99</span>
                                <button class="bg-blue-500/50 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full">
                                    Ajouter au panier
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
            <aside class="bg-slate-100 p-4 md:w-1/3">Sidebar</aside>
        </div>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 p-4">
                <div class="bg-white p-4 shadow">Carte 1</div>
                <div class="bg-white p-4 shadow">Carte 2</div>
                <div class="bg-white p-4 shadow">Carte 3</div>
                <div class="bg-white p-4 shadow">Carte 4</div>
        </section>
    </main>

    <footer class="bg-slate-800 p-4 text-center text-white text-sm">© 2026</footer>
</body>
</html>
