<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
        Point d'entrée SASS via le module TypeScript.
        Vite compile le SASS à la volée lors du développement
        et génère un CSS optimisé lors du build.
    -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/home.ts"></script>
    <title>MangaDash — Accueil</title>
</head>

<!--
  Les styles globaux (fond sombre, couleur de texte) sont définis
  dans src/sass/base/_reset.scss. Le HTML reste lisible,
  sans classes utilitaires dans les balises.
-->

<body>

    <!--
        .layout → grille CSS [sidebar | contenu principal]
        Défini dans src/sass/layout/_layout.scss.
        Le modificateur .layout--collapsed réduit la sidebar (toggle JS).
    -->
    <div class="layout" id="layout">

        <!-- ============================================================
         .sidebar — barre de navigation latérale (layout/_sidebar.scss)
         Architecture BEM :
           .sidebar               → Bloc
           .sidebar__logo         → Élément (double underscore)
           .sidebar__link         → Élément
           .sidebar__link--active → Modificateur (double tiret)
         ============================================================ -->
        <aside class="sidebar" id="aside">

            <!-- .sidebar__logo → Élément BEM -->
            <div class="sidebar__logo">
                <svg class="sidebar__logo-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span class="sidebar__label menu-label">MangaDash</span>
            </div>

            <nav class="sidebar__nav">
                <!--
          .sidebar__link--active → Modificateur BEM indiquant la page courante.
          Le style est défini dans _sidebar.scss avec le sélecteur &--active.
        -->
                <a href="./index.html" class="sidebar__link sidebar__link--active">
                    <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="sidebar__label menu-label">Accueil</span>
                </a>

                <a href="./table.html" class="sidebar__link">
                    <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span class="sidebar__label menu-label">Catalogue</span>
                </a>

                <a href="./stats.html" class="sidebar__link">
                    <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <span class="sidebar__label menu-label">Statistiques</span>
                </a>
            </nav>

            <footer class="sidebar__footer">
                <span class="menu-label">© 2026 MangaDash</span>
            </footer>
        </aside>

        <!-- Zone principale -->
        <div class="layout__main">

            <!-- .header (layout/_header.scss) -->
            <header class="header">
                <button class="header__toggle" id="toggle">☰</button>
                <h1 class="header__title">Tableau de bord</h1>
                <div class="header__actions">
                    <span class="header__badge" id="header-count">20 mangas</span>
                    <div class="header__avatar">N</div>
                </div>
            </header>

            <!-- .main (layout/_layout.scss) -->
            <main class="main">

                <!-- Contrôles : titre, recherche, filtres (pages/_home.scss) -->
                <section class="controls">
                    <div class="controls__header">
                        <div>
                            <h2 class="controls__title">Catalogue Manga</h2>
                            <p class="controls__subtitle">Explorez notre sélection de mangas</p>
                        </div>
                        <span class="controls__count" id="result-count"></span>
                    </div>

                    <!--
            .search-input (components/_forms.scss)
            Styles d'état (:focus, ::placeholder) définis avec le mixin focus-ring().
          -->
                    <input type="search" id="search" placeholder="🔍 Rechercher un titre, un auteur…"
                        class="search-input" />

                    <!--
            Boutons de filtre (components/_buttons.scss)
            .filter-btn--active → Modificateur BEM activé via JS
          -->
                    <div class="controls__filters" id="filters">
                        <button class="filter-btn filter-btn--active" data-filter="all">Tous</button>
                        <button class="filter-btn" data-filter="shonen">Shōnen</button>
                        <button class="filter-btn" data-filter="shojo">Shōjo</button>
                        <button class="filter-btn" data-filter="seinen">Seinen</button>
                        <button class="filter-btn" data-filter="josei">Josei</button>
                    </div>
                </section>

                <!--
                .cards-grid (pages/_home.scss)
                Grille responsive définie en SASS avec le mixin responsive().
                Passe de 1 à 2 puis 3 et 4 colonnes selon la largeur d'écran.
                -->
                <section class="cards-grid" id="cards-grid">
                    <div class="loading-state" id="loading">
                        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                        </svg>
                        Chargement des mangas…
                    </div>
                </section>

                <div class="empty-state" id="no-result" style="display:none">
                    <p class="empty-state__icon">📭</p>
                    <p class="empty-state__title">Aucun manga trouvé</p>
                    <p class="empty-state__desc">Essayez un autre terme ou catégorie.</p>
                </div>

            </main>
        </div>
    </div>

</body>

</html>
