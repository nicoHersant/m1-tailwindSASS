<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="/src/sass-main.ts"></script>
  <title>MangaDash — Catalogue</title>
</head>

<body>
  <div class="layout" id="layout">

    <aside class="sidebar" id="aside">
      <div class="sidebar__logo">
        <svg class="sidebar__logo-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span class="sidebar__label menu-label">MangaDash</span>
      </div>

      <nav class="sidebar__nav">
        <a href="./index.html" class="sidebar__link">
          <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="sidebar__label menu-label">Accueil</span>
        </a>

        <!-- sidebar__link--active → page courante -->
        <a href="./table.html" class="sidebar__link sidebar__link--active">
          <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span class="sidebar__label menu-label">Catalogue</span>
        </a>

        <a href="./stats.html" class="sidebar__link">
          <svg class="sidebar__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span class="sidebar__label menu-label">Statistiques</span>
        </a>
      </nav>

      <footer class="sidebar__footer">
        <span class="menu-label">© 2026 MangaDash</span>
      </footer>
    </aside>

    <div class="layout__main">

      <header class="header">
        <button class="header__toggle" id="toggle">☰</button>
        <h1 class="header__title">Catalogue</h1>
        <div class="header__actions">
          <span class="header__badge" id="header-count">20 mangas</span>
        </div>
      </header>

      <main class="main">

        <!-- En-tête de page (pages/_catalogue.scss) -->
        <div class="page-header">
          <div class="page-header__info">
            <h2 class="page-header__title">Tous les mangas</h2>
            <p class="page-header__subtitle">
              <span id="count-label">20</span> entrées dans la base
            </p>
          </div>
          <div class="page-header__controls">
            <input type="search" id="search" placeholder="🔍 Rechercher…" class="search-input search-input--constrained" />
            <button class="btn btn--ghost">
              <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18M3 12h18M3 20h18" />
              </svg>
              Filtres
            </button>
          </div>
        </div>

        <!-- Filtres par catégorie (components/_buttons.scss) -->
        <div class="controls__filters" id="filters" style="display:flex;flex-wrap:wrap;gap:.5rem">
          <button class="filter-btn filter-btn--active" data-filter="all">Tous</button>
          <button class="filter-btn" data-filter="shonen">Shōnen</button>
          <button class="filter-btn" data-filter="shojo">Shōjo</button>
          <button class="filter-btn" data-filter="seinen">Seinen</button>
          <button class="filter-btn" data-filter="josei">Josei</button>
        </div>

        <!--
          .data-table-wrapper → conteneur avec overflow-x:auto (components/_table.scss)
          Technique responsive standard pour les tableaux larges.
        -->
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <!--
                  .data-table__th (components/_table.scss)
                  data-col : attribut lu par le JS pour le tri par colonne
                -->
                <th class="data-table__th" style="width:3rem">#</th>
                <th class="data-table__th">Image</th>
                <th class="data-table__th" data-col="title">
                  Titre <span class="sort-icon">↕</span>
                </th>
                <th class="data-table__th" data-col="author" style="display:none" id="th-author">
                  Auteur <span class="sort-icon">↕</span>
                </th>
                <th class="data-table__th" id="th-cat">Catégorie</th>
                <th class="data-table__th" data-col="year" id="th-year" style="display:none">
                  Année <span class="sort-icon">↕</span>
                </th>
                <th class="data-table__th" data-col="volumes" id="th-vol" style="display:none">
                  Volumes <span class="sort-icon">↕</span>
                </th>
                <th class="data-table__th" data-col="price">
                  Prix <span class="sort-icon">↕</span>
                </th>
                <th class="data-table__th" data-col="rating" id="th-rating" style="display:none">
                  Note <span class="sort-icon">↕</span>
                </th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td colspan="9" class="data-table__cell" style="text-align:center;padding:2.5rem">
                  Chargement…
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="no-result" style="display:none;text-align:center;padding:2.5rem;color:#94a3b8">
          Aucun manga ne correspond à votre recherche.
        </div>

      </main>
    </div>
  </div>


  <script>
    /* TOGGLE SIDEBAR */
    const toggle = document.getElementById('toggle')
    const layout = document.getElementById('layout')
    const labels = document.querySelectorAll('.menu-label')

    toggle.addEventListener('click', () => {
      layout.classList.toggle('layout--collapsed')
      labels.forEach(l => l.classList.toggle('is-hidden'))
    })

    /* Colonnes responsive (afficher/masquer selon la largeur) */
    function updateColumns() {
      const w = window.innerWidth
      document.getElementById('th-author').style.display  = w >= 768  ? '' : 'none'
      document.getElementById('th-cat').style.display     = w >= 640  ? '' : 'none'
      document.getElementById('th-year').style.display    = w >= 1024 ? '' : 'none'
      document.getElementById('th-vol').style.display     = w >= 1280 ? '' : 'none'
      document.getElementById('th-rating').style.display  = w >= 1024 ? '' : 'none'
    }
    updateColumns()
    window.addEventListener('resize', updateColumns)

    /* DONNÉES */
    const CAT = { shonen:'Shōnen', shojo:'Shōjo', seinen:'Seinen', josei:'Josei' }
    let allMangas = [], activeFilter = 'all', searchQuery = '', sortCol = null, sortAsc = true

    function renderRow(m, i) {
      const w = window.innerWidth
      return `
        <tr class="data-table__row">
          <td class="data-table__cell data-table__cell--muted" style="font-size:.75rem">${String(i+1).padStart(2,'0')}</td>
          <td class="data-table__cell data-table__cell--thumb">
            <img src="${m.cover}" alt="${m.title}" loading="lazy" />
          </td>
          <td class="data-table__cell data-table__cell--title">${m.title}</td>
          ${w >= 768  ? `<td class="data-table__cell data-table__cell--muted">${m.author}</td>` : ''}
          ${w >= 640  ? `<td class="data-table__cell"><span class="badge badge--${m.category}">${CAT[m.category]}</span></td>` : ''}
          ${w >= 1024 ? `<td class="data-table__cell data-table__cell--muted">${m.year}</td>` : ''}
          ${w >= 1280 ? `<td class="data-table__cell data-table__cell--center">${m.volumes}</td>` : ''}
          <td class="data-table__cell data-table__cell--price">${m.price.toFixed(2)} €</td>
          ${w >= 1024 ? `<td class="data-table__cell"><span style="color:#f59e0b">★</span> ${m.rating}</td>` : ''}
        </tr>`
    }

    function renderTable(mangas) {
      const tbody = document.getElementById('table-body')
      const noRes = document.getElementById('no-result')
      const hCount = document.getElementById('header-count')
      const cl = document.getElementById('count-label')
      const label = `${mangas.length} manga${mangas.length > 1 ? 's' : ''}`
      if (hCount) hCount.textContent = label
      if (cl)     cl.textContent     = mangas.length

      if (!mangas.length) { tbody.innerHTML=''; noRes.style.display='block'; return }
      noRes.style.display = 'none'
      tbody.innerHTML = mangas.map((m,i) => renderRow(m,i)).join('')
    }

    function applyFilters() {
      let r = allMangas
      if (activeFilter !== 'all') r = r.filter(m => m.category === activeFilter)
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase()
        r = r.filter(m => m.title.toLowerCase().includes(q) || m.author.toLowerCase().includes(q))
      }
      if (sortCol) {
        r = [...r].sort((a,b) => {
          const va = a[sortCol], vb = b[sortCol]
          return typeof va === 'string'
            ? (sortAsc ? va.localeCompare(vb) : vb.localeCompare(va))
            : (sortAsc ? va - vb : vb - va)
        })
      }
      renderTable(r)
    }

    fetch('/mangas.json').then(r => r.json()).then(data => { allMangas=data; renderTable(allMangas) })

    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('[data-filter]')
      if (!btn) return
      activeFilter = btn.dataset.filter
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('filter-btn--active', b===btn))
      applyFilters()
    })

    let timer
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(timer); timer = setTimeout(() => { searchQuery = e.target.value; applyFilters() }, 200)
    })

    document.querySelectorAll('th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col
        sortAsc = sortCol === col ? !sortAsc : true
        sortCol = col
        document.querySelectorAll('.sort-icon').forEach(i => { i.textContent='↕'; i.style.color='' })
        const icon = th.querySelector('.sort-icon')
        if (icon) { icon.textContent = sortAsc ? '↑' : '↓'; icon.style.color = '#3b82f6' }
        th.classList.add('is-sorted')
        applyFilters()
      })
    })

    window.addEventListener('resize', () => renderTable(
      allMangas.filter(m => activeFilter === 'all' || m.category === activeFilter)
    ))
  </script>
</body>
</html>
